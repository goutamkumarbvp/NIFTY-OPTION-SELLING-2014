# (from amrt/) docker compose -f deploy/docker-compose.yml --env-file .env up -d --build   — reads amrt/.env
# Defaults are PAPER_ONLY. Live order flow needs AMRT_ENVIRONMENT=LIVE_CAPABLE *and* AMRT_LIVE_ORDERS_ENABLED=true
# in amrt/.env, plus the owner's readiness review inside the app — nothing in this file enables it.
name: amrt
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amrt
      POSTGRES_PASSWORD: ${AMRT_PG_PASSWORD:?set AMRT_PG_PASSWORD in .env}
      POSTGRES_DB: amrt
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U amrt"], interval: 5s, timeout: 3s, retries: 20}
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
    restart: unless-stopped
  app:
    build: {context: .., dockerfile: deploy/Dockerfile}
    env_file: [../.env]
    environment:
      AMRT_DATABASE_URL: postgresql+psycopg://amrt:${AMRT_PG_PASSWORD}@postgres:5432/amrt
      AMRT_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:8700:8700"]          # loopback only; put HTTPS in front before exposing it
    volumes: [runtime:/data]
    restart: unless-stopped
  watchdog:                                  # independent process: engages kill switch B if the app's heartbeat stops
    build: {context: .., dockerfile: deploy/Dockerfile}
    command: ["python", "-m", "amrt.reliability.watchdog", "--runtime-dir", "/data", "--stall-seconds", "15"]
    volumes: [runtime:/data]
    depends_on: [app]
    restart: unless-stopped
volumes:
  pgdata: {}
  runtime: {}
