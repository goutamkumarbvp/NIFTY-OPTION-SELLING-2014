[project]
name = "amrt"
version = "1.0.0"
description = "AI Market Risk Terminal: human-governed, multi-broker options risk platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "redis>=5",
  "httpx>=0.27",
  "pyotp>=2.9",
]

[project.optional-dependencies]
brokers = ["kotakneoapi==3.0.6", "kiteconnect>=5.0", "smartapi-python>=1.5", "upstox-python-sdk>=2.0", "growwapi>=1.0", "logzero", "websocket-client"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.5", "fakeredis>=2.20"]
llm = ["anthropic>=0.40"]

[tool.setuptools.packages.find]
include = ["amrt*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "unit: pure unit tests",
  "integration: needs PostgreSQL / Redis servers (skipped when unavailable)",
  "contract: broker SDK contract tests (needs broker SDKs installed)",
  "security: permission, isolation and secret-handling tests",
  "quant: numerical analytics / backtest tests",
  "e2e: API end-to-end tests",
  "chaos: failure-injection tests",
  "recovery: recovery and reconciliation tests",
  "replay: audit replay tests",
  "acceptance: mandatory acceptance tests (AT-xx)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B904", "UP007", "E731", "B905"]

[tool.coverage.run]
source = ["amrt"]
omit = ["amrt/__main__.py"]
